services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hakili
      POSTGRES_PASSWORD: hakili
      POSTGRES_DB: hakili
    ports:
      - '5432:5432'
    volumes:
      - hakili_pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hakili -d hakili']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hakili_pg_data:
